name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify shellcheck
        shell: bash
        run: |
          shellcheck --version || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Shellcheck
        shell: bash
        run: shellcheck --severity=warning brew-usage lib/*.sh tests/*.sh scripts/*.sh

      - name: Syntax check
        shell: bash
        run: bash scripts/syntax-check.sh

      - name: No stub gates
        shell: bash
        run: "! grep -rn 'not yet implemented' lib/"

      - name: Executable-bit gate
        # Squash merges have silently dropped exec bits on test scripts before
        # (PR #6/#7) — CI stayed green because suites run via `bash x.sh`.
        # Fail if any test script or the entry point is not mode 100755 in the index.
        shell: bash
        run: |
          bad=$(git ls-files -s tests/ scripts/ brew-usage | awk '$1 != 100755 {print $4}')
          if [[ -n "$bad" ]]; then
            echo "Files missing executable bit:" >&2
            echo "$bad" >&2
            exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run unit tests
        shell: bash
        run: |
          bash tests/test-size.sh
          bash tests/test-json-output.sh
          bash tests/test-cache.sh
          bash tests/test-all.sh
          bash tests/test-config.sh
          bash tests/test-doctor.sh
          bash tests/test-flush-cache.sh

  integration-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        shell: bash
        run: brew install jq

      - name: Run integration tests
        shell: bash
        run: |
          bash tests/test-size-lookup.sh
          bash tests/test-json-output.sh
          bash tests/test-cache.sh
          bash tests/test-all.sh
          bash tests/test-config.sh
          bash tests/test-doctor.sh
          bash tests/test-flush-cache.sh

  integration-linux:
    # Verifies the README's Linux support claim on real linuxbrew
    # (ubuntu-latest runners: x86_64, glibc 2.39, GNU stat).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew (linuxbrew)
        shell: bash
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install test dependencies
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install jq hello

      - name: Run integration tests
        shell: bash
        run: |
          bash tests/test-size-lookup.sh
          bash tests/test-json-output.sh
          bash tests/test-cache.sh
          bash tests/test-all.sh
          bash tests/test-config.sh
          bash tests/test-doctor.sh
          bash tests/test-flush-cache.sh
